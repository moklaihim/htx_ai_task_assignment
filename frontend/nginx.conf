server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service on the compose network, stripping the
    # /api prefix so the browser and the backend can both use plain paths and no
    # CORS configuration is needed (design §7.2).
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths return index.html so client-side routes such as
    # /tasks/new can be deep-linked or refreshed (REQ-0.7).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
